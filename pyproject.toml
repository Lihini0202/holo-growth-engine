[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "holo-growth-engine"
version = "0.1.0"
description = "Go-to-market automation for Holo: event lead pipeline, consent-aware CRM sync, lifecycle campaigns, content checks and AI-search (GEO) tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lihini Sewmini" }]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "openpyxl>=3.1",
    "mcp>=2.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "pandas>=2.0"]
ga4 = ["google-auth>=2.30"]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
holo-growth = "holo_growth.cli:app"
holo-growth-mcp = "holo_growth.mcp_server:main"

[tool.setuptools.packages.find]
include = ["holo_growth*"]

[tool.setuptools.package-data]
holo_growth = ["data/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as call defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
