name: Weekly growth run

# Weekly run, Mondays 08:00 Asia/Colombo (02:30 UTC): lifecycle and subscription
# sync, GA4 sync when configured, GEO check, and the brief as a workflow artifact.
# Skips all steps when the required secrets are not configured.
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      HOLO_GROWTH_DB: holo_growth.db
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
      HUBSPOT_SUBSCRIPTION_ID: ${{ vars.HUBSPOT_SUBSCRIPTION_ID }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
      HOLO_SUPABASE_URL: ${{ secrets.HOLO_SUPABASE_URL }}
      HOLO_SUPABASE_SERVICE_KEY: ${{ secrets.HOLO_SUPABASE_SERVICE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HOLO_GEO_OPENROUTER_MODELS: ${{ vars.HOLO_GEO_OPENROUTER_MODELS }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HUBSPOT_PRIVATE_APP_TOKEN" ] || [ -z "$HOLO_SUPABASE_URL" ]; then
            echo "Secrets not configured; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Run
        if: steps.cfg.outputs.run == 'true'
        run: |
          pip install -e ".[ga4]"
          holo-growth retention sync
          if [ -n "$GA4_PROPERTY_ID" ] && [ -n "$GA4_SERVICE_ACCOUNT_JSON" ]; then
            export GA4_CREDENTIALS_FILE="$RUNNER_TEMP/ga4.json"
            printf '%s' "$GA4_SERVICE_ACCOUNT_JSON" > "$GA4_CREDENTIALS_FILE"
            holo-growth web sync
          fi
          holo-growth geo run
          holo-growth report brief --out weekly_brief.md

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.run == 'true'
        with:
          name: weekly-brief
          path: weekly_brief.md
