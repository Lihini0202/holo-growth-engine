name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,dashboard,ga4]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy holo_growth

      # No secrets in CI: external APIs are mocked (respx) or replaced by offline
      # fallbacks, so tests are deterministic and safe for pull requests from forks.
      - name: Test
        run: pytest --cov=holo_growth --cov-report=term --cov-fail-under=80

      - name: End-to-end demo (offline)
        run: holo-growth demo --db-path /tmp/demo.db

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Full-history scan with the pinned, checksum-verified gitleaks CLI. The gitleaks
      # action scans "<first>^..<last>" on push, which fails on a repository's first push.
      - name: Install gitleaks
        env:
          VERSION: 8.24.3
          SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz

      - name: Scan
        run: ./gitleaks git . --redact --verbose --no-banner
